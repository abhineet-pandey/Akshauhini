name: Test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build web UI into the package
        run: |
          cd web && npm ci && npm test && npm run build && cd ..
          python scripts/package_ui.py
      - run: pip install build twine
      - run: python -m build
      - run: python scripts/check_dist.py dist
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/akshauhini --version
          (cd /tmp && AKSHAUHINI_HOME=/tmp/ak /tmp/smoke/bin/akshauhini --port 8790 serve &) && sleep 4
          curl -sf http://127.0.0.1:8790/api/health && curl -sf http://127.0.0.1:8790/ | grep -q '<div id="root">'
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    # Tag a release (git tag v0.1.0 && git push --tags) after adding a "pypi" environment and a PyPI trusted publisher.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
