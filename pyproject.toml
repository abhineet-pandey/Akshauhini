[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "akshauhini"
dynamic = ["version"]
description = "Live visual monitoring, LLM tracing and LLM evaluation for multi-agent applications: see why agents are stuck, slow, looping or failing, and whether a new version is worse."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abhineet Pandey" }]
keywords = ["agents", "multi-agent", "llm", "llm-tracing", "llm-evaluation", "llm-observability", "evaluation", "local-llm", "observability", "telemetry", "tracing", "opentelemetry", "dashboard", "claude-code", "codex", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/abhineet-pandey/Akshauhini"
Source = "https://github.com/abhineet-pandey/Akshauhini"
Issues = "https://github.com/abhineet-pandey/Akshauhini/issues"
Documentation = "https://github.com/abhineet-pandey/Akshauhini/blob/main/docs/CONNECTING_APPS.md"

[project.scripts]
akshauhini = "akshauhini.cli:main"

[tool.setuptools.dynamic]
version = { attr = "akshauhini.__version__" }

[tool.setuptools.packages.find]
include = ["akshauhini*"]

[tool.setuptools.package-data]
akshauhini = ["static/**/*", "static/*", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
