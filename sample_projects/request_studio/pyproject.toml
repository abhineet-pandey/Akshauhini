[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "akshauhini-request-studio"
version = "0.1.0"
description = "A request-driven evidence demo monitored by Akshauhini"
requires-python = ">=3.11"
dependencies = ["akshauhini>=0.1.0"]
[project.scripts]
request-studio = "studio.app:main"
[tool.setuptools.packages.find]
include = ["studio*"]
[tool.setuptools.package-data]
studio = ["*.html", "sources/*.md"]
